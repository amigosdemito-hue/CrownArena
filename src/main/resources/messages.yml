stats-line: "<gold><bold><player></bold></gold> <dark_gray>│</dark_gray> <gray>Eventos</gray> <white><events></white> <dark_gray>·</dark_gray> <green>Victorias</green> <white><wins></white> <dark_gray>·</dark_gray> <aqua>Kills</aqua> <white><kills></white> <dark_gray>·</dark_gray> <red>Muertes</red> <white><deaths></white> <dark_gray>·</dark_gray> <gold>Tótems</gold> <white><totems></white> <dark_gray>·</dark_gray> <light_purple>Mejor racha</light_purple> <white><streak></white>"
