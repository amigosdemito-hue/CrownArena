ranking-header: "<gradient:#ffd76a:#ff8c3a><bold>▎ RANKING: <stat></bold></gradient>"
ranking-line: "<gray><pos>.</gray> <white><bold><player></bold></white> <dark_gray>—</dark_gray> <yellow><value></yellow>"
ranking-empty: "<gray><bold>— AÚN NO HAY DATOS</bold></gray> <gray>El ranking se llenará con el tiempo.</gray>"
top-line: "<gold><bold><pos>º</bold></gold> <white><player></white> <dark_gray>—</dark_gray> <green><kills> kills</green> <dark_gray>·</dark_gray> <red><deaths> muertes</red>"
